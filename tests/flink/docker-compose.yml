# End-to-end CDC validation:
#   MySQL (binlog source) --Flink CDC snapshot+stream--> thinDB (JDBC upsert sink)
#
# thinDB runs on the HOST (Windows/Linux) on port 13306; Flink reaches it via
# host.docker.internal. The MySQL source runs here in Docker. See README.md.
services:
  mysql:
    image: mysql:8.0
    command: >-
      --server-id=223344
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: src
    ports:
      - "13307:3306" # host access to seed/insert into the source
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        execution.checkpointing.interval: 3s
        state.checkpoints.dir: file:///checkpoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        heartbeat.timeout: 300000
        heartbeat.interval: 30000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./job.sql:/opt/sql/job.sql:ro
      - ./cdc_job.sql:/opt/sql/cdc_job.sql:ro
      - ./_checkpoints:/checkpoints
    depends_on:
      mysql:
        condition: service_healthy

  taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    depends_on:
      - jobmanager
    command: taskmanager
    # The TM deliberately self-kills when a task cancellation wedges past the
    # 180s cancellation watchdog (seen twice on 2026-07-09: cancelling a job
    # whose binlog reader was stuck on a dead WAN socket). Jobs redeploy from
    # checkpoints on the replacement TM; the sync watchdog records the event.
    restart: unless-stopped
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 16
        taskmanager.memory.process.size: 24g
        taskmanager.memory.managed.fraction: 0.1
        heartbeat.timeout: 300000
        heartbeat.interval: 30000
        state.checkpoints.dir: file:///checkpoints
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./_checkpoints:/checkpoints
