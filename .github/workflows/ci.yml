name: ci

# Test suite on every push to every branch (and PRs). Windows and Linux
# x86-64 are blocking gates (suite green on both, 1373/1376, since the _xa
# iterate fix). Linux ARM64 and macOS Apple Silicon run the same suite on
# native runners but are non-blocking (experimental) until they prove green —
# same promotion path Linux took. macOS Intel is build-only (runner class
# retired by GitHub; least important target).

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: zig fmt --check
        run: zig fmt --check src tests bench build.zig scripts

      - name: zlint (rules in zlint.json)
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/zlint" \
            "https://github.com/DonIsaac/zlint/releases/download/v0.9.0/zlint-linux-x86_64"
          chmod +x "$RUNNER_TEMP/zlint"
          git ls-files 'src/**/*.zig' 'src/*.zig' | "$RUNNER_TEMP/zlint" -S -f github --deny-warnings

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        shell: pwsh
        run: |
          curl.exe -fL "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -o "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\zig-x86_64-windows-$env:ZIG_VERSION"

      - name: Cache zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-cache-windows-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: zig-cache-windows-${{ env.ZIG_VERSION }}-

      - name: Run test suite
        run: zig build test

  test-unix:
    name: test-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            zig_arch_os: x86_64-linux
            experimental: false
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            zig_arch_os: aarch64-linux
            experimental: true
          - name: macos-aarch64
            runner: macos-latest
            zig_arch_os: aarch64-macos
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.zig_arch_os }}-${ZIG_VERSION}.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-${{ matrix.zig_arch_os }}-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Cache zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-cache-${{ matrix.name }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: zig-cache-${{ matrix.name }}-${{ env.ZIG_VERSION }}-

      - name: Run test suite
        run: zig build test
