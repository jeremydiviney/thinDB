name: release

# Every push to main builds the five platform bundles (server + matching Zig
# toolchain) and publishes them as a GitHub Release tagged vX.Y.Z: X.Y comes
# from the VERSION file (human-controlled), Z auto-increments as the number
# of commits since VERSION last changed — bumping VERSION resets it to 0.
# Assets are uploaded twice: once version-named (thindb-X.Y.Z-<platform>) and
# once stable-named (thindb-<platform>) so
# /releases/latest/download/thindb-<platform>.tar.gz is a permanent URL that
# always serves the newest build — the doc site links those directly and
# never needs a rebuild.

# Chained behind ci: a push to main runs the four-platform test matrix
# first, and only a fully green ci run triggers the release build — a
# commit that fails tests never publishes. workflow_dispatch remains for
# on-demand bundle builds from ANY branch (Actions tab → release → Run
# workflow): bundles upload as a workflow artifact, but a GitHub Release
# is only ever published from main.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # workflow_run events default to the branch head at trigger time;
          # pin to the exact commit the ci run tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install bsdtar
        run: sudo apt-get update -q && sudo apt-get install -y -q libarchive-tools

      - name: Cache bundled toolchains
        uses: actions/cache@v6
        with:
          path: .dist-cache
          key: zig-toolchains-${{ env.ZIG_VERSION }}

      - name: Compute version
        id: version
        run: |
          base=$(tr -d ' \n' < VERSION)
          anchor=$(git log -1 --format=%H -- VERSION)
          patch=$(git rev-list --count "$anchor..HEAD")
          echo "version=$base.$patch" >> "$GITHUB_OUTPUT"
          echo "thinDB version: $base.$patch"

      - name: Build bundles
        env:
          THINDB_VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/make_dist.mjs

      - name: Add stable-named copies
        run: |
          cd .dist
          for plat in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            cp thindb-*-"$plat".tar.gz "thindb-$plat.tar.gz"
          done
          cp thindb-*-windows-x86_64.zip thindb-windows-x86_64.zip
          sha256sum thindb-linux-x86_64.tar.gz thindb-linux-aarch64.tar.gz \
            thindb-macos-x86_64.tar.gz thindb-macos-aarch64.tar.gz \
            thindb-windows-x86_64.zip >> SHA256SUMS

      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: thindb-bundles-${{ github.sha }}
          path: |
            .dist/thindb-*
            .dist/SHA256SUMS
          retention-days: 14

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          # Idempotent republish: a workflow re-run of the same commit
          # produces the same version — replace, don't fail.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --target "$RELEASE_SHA" \
            --title "thinDB $tag" \
            --notes "Automated build of $RELEASE_SHA. Stable links: releases/latest/download/thindb-<platform>.{tar.gz,zip}" \
            --latest \
            .dist/thindb-* .dist/SHA256SUMS

      - name: Prune old automated builds (keep 10)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -n +11 \
            | xargs -r -n1 -I{} gh release delete {} --yes --cleanup-tag
          # Retire the pre-semver build-<sha> releases entirely.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' \
            | xargs -r -n1 -I{} gh release delete {} --yes --cleanup-tag
